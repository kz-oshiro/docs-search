<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>docs-search</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./boot.js"></script>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">DOCUMENT SEARCH</p><h1>docs-search</h1></div><p class="header-description">フォルダー内の文書を、まとめて検索。</p></header>
    <form id="search-form">
      <div class="search-fields">
        <div class="field"><label for="root">検索フォルダー</label><div class="inline"><input id="root" type="text" autocomplete="off" placeholder="検索するフォルダーを選択" aria-describedby="root-error"><button id="pick" type="button">参照…</button></div><small id="root-error" class="error" role="alert"></small></div>
        <div class="field"><label for="query">検索語</label><input id="query" type="text" autocomplete="off" placeholder="探したい言葉を入力" aria-describedby="query-error"><small id="query-error" class="error" role="alert"></small></div>
      </div>
      <fieldset class="field" aria-describedby="extensions-error">
        <legend>対象ファイル</legend>
        <details class="extension-picker">
          <summary><span class="extension-picker-title">検索する拡張子</span><span id="selected-extension-count" class="extension-count" aria-live="polite">93 種類選択中</span></summary>
          <div class="extension-toolbar"><p class="extension-help">種類ごとに開いて選択できます。</p><div class="extension-bulk-actions"><button id="select-all-extensions" type="button">すべて選択</button><button id="clear-all-extensions" type="button">すべて解除</button></div></div>
        <div class="extension-groups">
          <details class="extension-group" open><summary>Office 文書</summary><div class="extension-group-actions"><button class="group-toggle" type="button">分類内をすべて解除</button></div><div class="extension-options">
            <label class="extension-option"><input type="checkbox" name="extension" value="xlsx" checked>.xlsx</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="xlsm" checked>.xlsm</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="pptx" checked>.pptx</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="docx" checked>.docx</label>
          </div></details>
          <details class="extension-group" open><summary>テキスト・文書・表データ</summary><div class="extension-group-actions"><button class="group-toggle" type="button">分類内をすべて解除</button></div><div class="extension-options">
            <label class="extension-option"><input type="checkbox" name="extension" value="txt" checked>.txt</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="md" checked>.md</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="markdown" checked>.markdown</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="mdx" checked>.mdx</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="rst" checked>.rst</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="adoc" checked>.adoc</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="log" checked>.log</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="csv" checked>.csv</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="tsv" checked>.tsv</label>
          </div></details>
          <details class="extension-group"><summary>Web・マークアップ</summary><div class="extension-group-actions"><button class="group-toggle" type="button">分類内をすべて解除</button></div><div class="extension-options">
            <label class="extension-option"><input type="checkbox" name="extension" value="jsp" checked>.jsp</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="xhtml" checked>.xhtml</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="html" checked>.html</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="htm" checked>.htm</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="vue" checked>.vue</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="svelte" checked>.svelte</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="astro" checked>.astro</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="css" checked>.css</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="scss" checked>.scss</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="sass" checked>.sass</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="less" checked>.less</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="svg" checked>.svg</label>
          </div></details>
          <details class="extension-group"><summary>JavaScript・TypeScript</summary><div class="extension-group-actions"><button class="group-toggle" type="button">分類内をすべて解除</button></div><div class="extension-options">
            <label class="extension-option"><input type="checkbox" name="extension" value="js" checked>.js</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="mjs" checked>.mjs</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="cjs" checked>.cjs</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="jsx" checked>.jsx</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="ts" checked>.ts</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="mts" checked>.mts</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="cts" checked>.cts</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="tsx" checked>.tsx</label>
          </div></details>
          <details class="extension-group"><summary>プログラム・スクリプト</summary><div class="extension-group-actions"><button class="group-toggle" type="button">分類内をすべて解除</button></div><div class="extension-options">
            <label class="extension-option"><input type="checkbox" name="extension" value="java" checked>.java</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="kt" checked>.kt</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="kts" checked>.kts</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="groovy" checked>.groovy</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="gradle" checked>.gradle</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="py" checked>.py</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="rb" checked>.rb</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="php" checked>.php</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="go" checked>.go</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="rs" checked>.rs</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="c" checked>.c</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="h" checked>.h</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="cc" checked>.cc</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="cpp" checked>.cpp</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="hpp" checked>.hpp</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="cs" checked>.cs</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="swift" checked>.swift</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="scala" checked>.scala</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="sh" checked>.sh</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="bash" checked>.bash</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="zsh" checked>.zsh</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="ps1" checked>.ps1</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="bat" checked>.bat</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="cmd" checked>.cmd</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="sql" checked>.sql</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="dart" checked>.dart</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="lua" checked>.lua</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="r" checked>.r</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="jl" checked>.jl</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="pl" checked>.pl</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="ex" checked>.ex</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="exs" checked>.exs</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="clj" checked>.clj</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="cljs" checked>.cljs</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="fs" checked>.fs</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="fsx" checked>.fsx</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="vb" checked>.vb</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="vbs" checked>.vbs</label>
          </div></details>
          <details class="extension-group"><summary>設定・構造化データ</summary><div class="extension-group-actions"><button class="group-toggle" type="button">分類内をすべて解除</button></div><div class="extension-options">
            <label class="extension-option"><input type="checkbox" name="extension" value="json" checked>.json</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="jsonc" checked>.jsonc</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="jsonl" checked>.jsonl</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="ndjson" checked>.ndjson</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="yaml" checked>.yaml</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="yml" checked>.yml</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="toml" checked>.toml</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="xml" checked>.xml</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="xsd" checked>.xsd</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="xsl" checked>.xsl</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="xslt" checked>.xslt</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="ini" checked>.ini</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="cfg" checked>.cfg</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="conf" checked>.conf</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="properties" checked>.properties</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="tf" checked>.tf</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="hcl" checked>.hcl</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="tfvars" checked>.tfvars</label>
          </div></details>
          <details class="extension-group"><summary>スキーマ・ノートブック</summary><div class="extension-group-actions"><button class="group-toggle" type="button">分類内をすべて解除</button></div><div class="extension-options">
            <label class="extension-option"><input type="checkbox" name="extension" value="graphql" checked>.graphql</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="gql" checked>.gql</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="proto" checked>.proto</label>
            <label class="extension-option"><input type="checkbox" name="extension" value="ipynb" checked>.ipynb</label>
          </div></details>
        </div>
        </details>
        <small id="extensions-error" class="error" role="alert"></small>
      </fieldset>
      <div class="actions"><button id="search" type="submit">検索</button><button id="cancel" type="button" disabled>中断</button></div>
    </form>
    <section class="summary" aria-live="polite"><strong id="status">待機中</strong><span id="counts">結果 0 · 処理 0 · エラー 0</span></section>
    <p id="general-error" class="notice notice-error" role="alert"></p>
    <p id="copy-status" class="notice notice-success" role="status"></p>
    <details id="issues-panel" class="issues-panel" hidden>
      <summary>読み取りエラー <span id="issue-count">0</span> 件</summary>
      <ul id="issues"></ul>
    </details>
    <section class="results-panel"><div class="results-heading"><h2>検索結果</h2><span>ファイル名から元ファイルを開けます</span></div><div id="results" class="results" role="list"></div><p id="empty-state" class="empty-state">フォルダーと検索語を指定して、検索を始めてください。</p><button id="more" type="button" hidden>さらに表示</button></section>
  </main>
</body>
</html>
